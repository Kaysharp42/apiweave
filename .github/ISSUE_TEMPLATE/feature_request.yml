name: Feature request
description: Suggest a change or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today? Describe the problem rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: Optional. What you do today instead, or other tools that handle it.
