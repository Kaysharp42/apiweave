# Packaged-app smoke test on every OS. Packages the app with electron-builder
# (`--dir`: the app the installers wrap, without the installers) and launches it
# with --smoke-test in a throwaway profile - see app/electron/smoke_test.ts and
# app/scripts/smoke-packaged.mjs. The app exits 0 only once the database has
# opened, the window has loaded app://local/ and the PTY host has started a
# process, so this catches what tests run from the source tree cannot: a native
# addon left inside app.asar, a dependency missing from the package, a broken
# app:// protocol handler or preload.
name: Desktop packaged smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/**/**
      - .github/workflows/desktop-smoke.yml
  push:
    branches: [main]
    paths:
      - app/**/**
      - .github/workflows/desktop-smoke.yml

permissions:
  contents: read

jobs:
  packaged-smoke:
    name: Packaged smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Never hunt the runner's keychain for a signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build renderer and main process
        working-directory: app
        run: npm run build:app

      - name: Package the app
        working-directory: app
        run: npx electron-builder --dir --publish never

      - name: Install Xvfb + Electron runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libgbm1 \
            libasound2

      - name: Launch the packaged app with --smoke-test
        working-directory: app
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a --server-args="-screen 0 1280x800x24" node scripts/smoke-packaged.mjs
          else
            node scripts/smoke-packaged.mjs
          fi
