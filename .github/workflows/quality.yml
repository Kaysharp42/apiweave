# The full quality gate: renderer, desktop and shared tests, both TypeScript
# configs, lint across every source tree, the renderer E2E suite and a renderer
# build. Runs on every push and PR, and desktop-release.yml calls it before any
# installer is built — one definition, so a release can never ship past a gate
# that PRs are held to.
name: Quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - name: Run tests
        run: npm test
        working-directory: app
      - name: Audit type organization
        run: npm run audit:types
        working-directory: app
      - name: Type check
        run: npm run typecheck
        working-directory: app
      - name: Lint
        run: npm run lint
        working-directory: app
      # The headless runner, built and run under plain Node the way a user's
      # CI runs it, against a fixture bundle and a fixture repository served
      # from a local server.
      - name: Build CLI
        run: npm run build:cli
        working-directory: app
      - name: Run CLI against the fixtures
        working-directory: app
        env:
          APIWEAVE_SECRET_API_TOKEN: ci-fixture-token
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory core/cli/__fixtures__ >/dev/null 2>&1 &
          for _ in $(seq 20); do curl -sf http://127.0.0.1:8787/health.json >/dev/null && break; sleep 0.5; done
          node dist/cli/apiweave.cjs run core/cli/__fixtures__/smoke.awecollection --env CI \
            --reporter cli,junit --reporter-junit-export "$RUNNER_TEMP/apiweave-junit.xml"
          grep -q 'failures="0"' "$RUNNER_TEMP/apiweave-junit.xml"
          # A workspace repository: every project in one report, each suite named
          # "<project>: <workflow>", the withheld credential a warning, not a failure.
          node dist/cli/apiweave.cjs run core/cli/__fixtures__/workspace-repo --env CI \
            --reporter cli,junit --reporter-junit-export "$RUNNER_TEMP/apiweave-repo-junit.xml"
          grep -q 'failures="0"' "$RUNNER_TEMP/apiweave-repo-junit.xml"
          grep -q 'name="Billing: List invoices"' "$RUNNER_TEMP/apiweave-repo-junit.xml"
          grep -q 'name="Shop API: Health check"' "$RUNNER_TEMP/apiweave-repo-junit.xml"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Run desktop renderer E2E
        run: npm run qa:ui
        working-directory: app
      - name: Build
        run: npm run build:renderer
        working-directory: app
