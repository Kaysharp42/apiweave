# The full quality gate: renderer, desktop and shared tests, both TypeScript
# configs, lint across every source tree, the renderer E2E suite and a renderer
# build. Runs on every push and PR, and desktop-release.yml calls it before any
# installer is built — one definition, so a release can never ship past a gate
# that PRs are held to.
name: Quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - name: Run tests
        run: npm test
        working-directory: app
      - name: Audit type organization
        run: npm run audit:types
        working-directory: app
      - name: Type check
        run: npm run typecheck
        working-directory: app
      - name: Lint
        run: npm run lint
        working-directory: app
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Run desktop renderer E2E
        run: npm run qa:ui
        working-directory: app
      - name: Build
        run: npm run build:renderer
        working-directory: app
