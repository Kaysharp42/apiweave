name: Fallow analysis
on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  fallow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm install

      - name: Run fallow audit
        id: fallow-audit
        uses: fallow-rs/fallow@fccff887da0d83db1711379e0a3696dfc2460fdd # v3.33.1
        with:
          root: app
          command: audit
          format: sarif
          gate: new-only
          annotations: true
          review-comments: true
          review-guidance: true
          fail-on-issues: true

      - name: Debug - locate fallow results
        if: always()
        run: find / -xdev -iname 'fallow-results*' 2>/dev/null || true

      - name: Debug - upload fallow results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fallow-debug-results
          path: |
            fallow-results.json
            fallow-results-scoped.json
            fallow-results.sarif
            app/fallow-results.json
            app/fallow-results-scoped.json
            app/fallow-results.sarif
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: fallow-results.sarif
          category: fallow
        if: always() && steps.fallow-audit.outputs.sarif_file
        continue-on-error: true
