name: Fallow analysis
on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  fallow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm install

      - name: Run fallow audit
        id: fallow-audit
        uses: fallow-rs/fallow@e36026dfc0f00bfdf8dab889efc58ab86e5ec466 # v2.104.0
        with:
          root: app
          command: audit
          format: sarif
          gate: new-only
          annotations: true
          review-comments: true
          review-guidance: true
          fail-on-issues: true

      - name: TEMP debug - raw fallow json
        if: always()
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          echo "base=$BASE"
          npx fallow audit --changed-since "$BASE" --gate new-only --format json --no-cache > fallow-debug.json || true

      - name: TEMP debug - upload fallow raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fallow-debug-results-3
          path: app/fallow-debug.json
          if-no-files-found: warn

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: fallow-results.sarif
          category: fallow
        if: always() && steps.fallow-audit.outputs.sarif_file
        continue-on-error: true
