name: Fallow analysis
on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  fallow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm install

      - name: Run fallow audit
        id: fallow-audit
        uses: fallow-rs/fallow@b802ddc49a09ad9df4e9894cdd465f5b51b1b0c8 # v3.45.0
        with:
          root: app
          command: audit
          format: sarif
          gate: new-only
          annotations: true
          review-comments: true
          review-guidance: true
          fail-on-issues: true

      - name: Debug - locate fallow results
        if: always()
        run: find / -xdev -iname 'fallow-results*' 2>/dev/null || true

      - name: Debug - upload fallow results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fallow-debug-results
          path: |
            fallow-results.json
            fallow-results-scoped.json
            fallow-results.sarif
            app/fallow-results.json
            app/fallow-results-scoped.json
            app/fallow-results.sarif
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: fallow-results.sarif
          category: fallow
        if: always() && steps.fallow-audit.outputs.sarif_file
        continue-on-error: true
