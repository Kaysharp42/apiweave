name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag, version, and main ancestry
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use SemVer, for example v0.6.0 or v0.6.0-beta.1." >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          node -e '
            const packageJson = require("./app/package.json");
            const packageLock = require("./app/package-lock.json");
            const expected = process.argv[1];
            if (packageJson.version !== expected || packageLock.version !== expected || packageLock.packages[""].version !== expected) {
              console.error(`Tag ${expected} does not match app/package.json and app/package-lock.json.`);
              process.exit(1);
            }
          ' "$version"

          git fetch --no-tags origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "The release tag must point to a commit on main." >&2
            exit 1
          fi

      # The four packaging jobs each run `electron-builder --publish always`,
      # and electron-builder's GitHub publisher resolves the target release by
      # listing releases and creating one when it finds no match. That
      # find-or-create is not atomic: two jobs starting together can both miss
      # and both create, and GitHub permits several drafts sharing a tag name.
      # The finalize job would then resolve just one of them and ship a
      # release missing half its installers. Creating the draft here, in the
      # single job every builder waits on, means they can only ever find it.
      # This is also where `--verify-tag` lives now that `gh release create`
      # no longer runs at the end of the pipeline.
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A draft means a previous attempt at this same tag failed partway
            # through — reusing it is exactly what the build jobs are for.
            # Anything else means the release is already live: rerunning the
            # build jobs against it would republish fresh latest.yml /
            # latest-linux.yml from scratch, silently resetting any
            # stagingPercentage the "Update rollout" workflow set for this tag
            # back to "everyone". That's the same class of "manifest changed
            # behind the release's back" this workflow guards against
            # elsewhere (the SHA256SUMS exclusion, --clobber), so refuse
            # instead of doing it quietly. Ship a new tag to rebuild.
            is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::$GITHUB_REF_NAME is already published. Re-running this workflow would reset its rollout percentage to everyone. Ship a new tag instead." >&2
              exit 1
            fi
            echo "A draft release already exists for $GITHUB_REF_NAME; the build jobs will reuse it."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "APIWeave $GITHUB_REF_NAME" \
            --notes "Build in progress. This release is finalized once every platform has published."

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            command: npx electron-builder --win nsis --x64 --publish always
          - name: macOS Intel
            id: macos-x64
            os: macos-15-intel
            command: npx electron-builder --mac dmg --x64 --publish always
          - name: macOS Apple Silicon
            id: macos-arm64
            os: macos-15
            command: npx electron-builder --mac dmg --arm64 --publish always
          - name: Linux x64
            id: linux-x64
            os: ubuntu-22.04
            command: npx electron-builder --linux AppImage deb rpm pacman --x64 --publish always
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot libarchive-tools rpm

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build application
        working-directory: app
        run: npm run build:app

      # electron-builder publishes straight to the draft GitHub release for
      # this tag as part of packaging — that's also what makes it write the
      # electron-updater manifests (latest.yml / latest-linux.yml) and
      # differential blockmaps, since those are only ever generated during an
      # actual publish, never with `--publish never`. The draft already exists
      # (the validate job created it), so every matrix job resolves the same
      # release rather than racing to create one.
      #
      # `build.publish` lists the generic provider first so app-update.yml
      # points the updater at /releases/latest/download/latest.yml — a
      # documented permalink — instead of letting electron-updater's GitHub
      # provider resolve versions by parsing releases.atom. The github entry
      # stays second and does the actual uploading. Consequence: latest.yml and
      # latest-linux.yml are now load-bearing for updates, not just metadata,
      # which is what the asset check in the finalize job below guards.
      - name: Package and publish installer
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ github.token }}
        run: ${{ matrix.command }}

      # What a person downloads on Windows is a zip wrapping the installer
      # electron-builder just published — a bare unsigned .exe is what browsers
      # and mail scanners flag most readily. The exe itself still has to stay
      # in the release: latest.yml names it, and electron-updater's NsisUpdater
      # downloads exactly that filename from this release's assets and cannot
      # consume an archive, so dropping the exe in favour of the zip would
      # break the update download for every installed client. The zip is for
      # humans; the exe beside it is for the updater.
      - name: Publish Windows installer zip
        if: matrix.id == 'windows-x64'
        working-directory: app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem release -Filter '*-win-x64.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            throw "No *-win-x64.exe in app/release — nothing to zip."
          }
          $zip = Join-Path $exe.DirectoryName "$($exe.BaseName).zip"
          Compress-Archive -LiteralPath $exe.FullName -DestinationPath $zip -Force
          gh release upload "$env:GITHUB_REF_NAME" $zip --repo "$env:GITHUB_REPOSITORY" --clobber

      - name: Upload build output (audit trail; the release itself already has these)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apiweave-${{ matrix.id }}
          path: |
            app/release/*.exe
            app/release/*-win-x64.zip
            app/release/*.dmg
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.rpm
            app/release/*.pacman
            app/release/latest*.yml
            app/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Finalize GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Each matrix job already published its own installer(s) plus update
      # metadata straight to the draft release for this tag (see the "Package
      # and publish installer" step above), so this job pulls that release's
      # assets down just to verify the full set landed and to checksum them —
      # it does not assemble or upload the installers itself.
      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The two macOS jobs each publish their own latest-mac.yml listing
          # only the arch they built, so whichever finished last left a
          # manifest that advertises half the release. Nothing reads it —
          # macOS is on the notice-only path because an unsigned build can't
          # get a self-update past Gatekeeper — so drop it rather than ship a
          # manifest that is wrong by construction. If macOS signing lands,
          # the fix is to build both arches in one job (`--x64 --arm64`) so
          # electron-builder emits a single manifest covering both.
          for stale in latest-mac.yml latest-mac.yml.blockmap; do
            gh release delete-asset "$GITHUB_REF_NAME" "$stale" \
              --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null \
              && echo "Removed single-arch $stale" \
              || echo "No $stale to remove"
          done

          mkdir assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets

          # A re-run downloads the SHA256SUMS.txt published by the previous
          # attempt, and `sha256sum *` below would then fold that file into
          # its own successor. Drop it so the manifest only ever covers the
          # artifacts it is vouching for.
          rm -f assets/SHA256SUMS.txt

          expected=(
            'assets/*-win-x64.exe'
            'assets/*-win-x64.zip'
            'assets/*-mac-x64.dmg'
            'assets/*-mac-arm64.dmg'
            'assets/*.AppImage'
            'assets/*.deb'
            'assets/*.rpm'
            'assets/*.pacman'
            'assets/latest.yml'
            'assets/latest-linux.yml'
          )
          for pattern in "${expected[@]}"; do
            compgen -G "$pattern" >/dev/null || {
              echo "Missing expected release asset: $pattern" >&2
              exit 1
            }
          done

          # The manifest the in-app update check reads, on the platforms that
          # can't self-install (macOS, deb/rpm/pacman). It exists so that check
          # depends on a documented GitHub permalink
          # (/releases/latest/download/<asset>) carrying a payload we define,
          # rather than on the shape of a redirect, an Atom feed, or
          # api.github.com's 60-request unauthenticated hourly budget.
          #
          # Only ever ADD fields here. A client already in the field reads
          # `version` and ignores the rest, and a broken update check is the one
          # bug that cannot be shipped through the update channel.
          version="${GITHUB_REF_NAME#v}"
          cat > assets/version.json <<EOF
          {
            "schema": 1,
            "version": "$version",
            "tag": "$GITHUB_REF_NAME"
          }
          EOF

          # latest*.yml are deliberately left out. They are updater metadata
          # rather than something a person downloads, they already carry their
          # own sha512 for the installer they point at, and the "Update rollout"
          # workflow rewrites them in place to stage or halt a release — which
          # would silently invalidate every line of this file.
          (cd assets && ls | grep -Ev '^(latest.*\.yml|SHA256SUMS\.txt)$' | xargs sha256sum > SHA256SUMS.txt)
          ls -lh assets

          gh release upload "$GITHUB_REF_NAME" assets/version.json assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # latest.yml and latest-linux.yml stopped being informational the moment
      # build.publish put the generic provider first: they are now what
      # electron-updater reads to decide an update exists, which file to fetch,
      # and what to check the bytes against. A manifest that disagrees with its
      # own release breaks updates for every client already installed — and a
      # broken update channel is the one bug that cannot be shipped through the
      # update channel. The asset list above proves these files exist; this
      # proves they are true.
      - name: Verify update manifests
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # electron-builder writes these manifests flat, so every field read
          # here is an unindented top-level scalar. The per-file sha512 nested
          # under `files:` is indented and deliberately not matched.
          # `|| true` so a missing field returns empty rather than tripping
          # `set -e` here — the explicit check below says which field is gone,
          # which is the whole value of failing at this step.
          #
          # `tr -d " '\""` strips spaces and quotes from the value, which only
          # works because `path` (the artifact filename) never contains a
          # space today, e.g. `APIWeave-0.7.0-win-x64.exe`. If that ever
          # changes, this silently truncates the filename and the
          # path-exists check below starts failing every build.
          top_scalar() {
            { grep -m1 "^$2:" "$1" || true; } | cut -d: -f2- | tr -d " '\""
          }

          check_manifest() {
            local manifest="$1"
            local manifest_version installer expected actual

            manifest_version="$(top_scalar "$manifest" version)"
            installer="$(top_scalar "$manifest" path)"
            expected="$(top_scalar "$manifest" sha512)"

            if [[ -z "$manifest_version" || -z "$installer" || -z "$expected" ]]; then
              echo "::error::$manifest is missing version, path or sha512" >&2
              exit 1
            fi

            # A manifest naming a version the release does not contain sends
            # every client after a file that isn't there.
            if [[ "$manifest_version" != "$version" ]]; then
              echo "::error::$manifest declares version $manifest_version but the tag is $version" >&2
              exit 1
            fi

            if [[ ! -f "assets/$installer" ]]; then
              echo "::error::$manifest points at $installer, which this release does not contain" >&2
              exit 1
            fi

            # electron-updater compares base64 of the raw sha512 digest, so the
            # comparison has to be made in exactly that encoding.
            actual="$(openssl dgst -sha512 -binary "assets/$installer" | openssl base64 -A)"
            if [[ "$expected" != "$actual" ]]; then
              echo "::error::$manifest sha512 does not match $installer — every update would fail its integrity check" >&2
              echo "  manifest: $expected" >&2
              echo "  actual:   $actual" >&2
              exit 1
            fi

            echo "$manifest -> $installer (v$manifest_version, sha512 verified)"
          }

          check_manifest assets/latest.yml
          check_manifest assets/latest-linux.yml

      - name: Generate release description
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          APIWeave desktop builds for Windows, macOS, and Linux.

          ## Downloads

          - **Windows:** x64 NSIS installer shipped as a `.zip` — extract it and run the `.exe` inside; installed copies update in place. The bare `.exe` asset beside it is the in-app updater's download; the `.zip` is the one to grab by hand.
          - **macOS:** Intel x64 and Apple Silicon arm64 disk images (`.dmg`)
          - **Linux:** portable AppImage (can install updates in place), Debian/Ubuntu (`.deb`), Fedora/RHEL/openSUSE (`.rpm`), and Arch/Manjaro (`.pacman`)

          The app notifies you when a new version exists and downloads it only once you agree; **Settings → Updates** can switch that to fully automatic or off.

          The Windows and macOS builds are currently unsigned. See the [installation guide](https://github.com/Kaysharp42/apiweave/blob/main/docs/getting-started/installation.md) for first-launch instructions. Verify downloads with `SHA256SUMS.txt`.

          EOF

          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body >> release-notes.md

      - name: Finalize GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag="--prerelease=false"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "APIWeave $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --draft=false \
            "$prerelease_flag"

  cleanup:
    name: Discard incomplete draft
    needs: [validate, build, publish]
    # Runs when anything upstream failed, and on cancellation — a build killed
    # halfway through still leaves the draft the validate job created.
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Delete the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only ever removes a release that is still a draft. Once finalize
          # has flipped it live the download URLs are public and possibly
          # already in someone's hands, so a late failure there is something
          # to fix forward, not to delete out from under people.
          #
          # The tag survives deliberately (no --cleanup-tag): it is what a
          # re-run of this workflow keys off, and deleting a pushed tag would
          # rewrite published history to paper over a build failure.
          state="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null || echo missing)"

          case "$state" in
            true)
              gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
              echo "Discarded the incomplete draft for $GITHUB_REF_NAME."
              ;;
            false)
              echo "::warning::$GITHUB_REF_NAME is already published; leaving it in place."
              ;;
            *)
              echo "No release exists for $GITHUB_REF_NAME; nothing to clean up."
              ;;
          esac
